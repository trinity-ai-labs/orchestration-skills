name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint every shell script
        run: shellcheck -S warning bin/*.sh

  manifests:
    name: plugin + marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The manifests parse and carry what Claude Code needs
        # `claude plugin validate --strict` is the authoritative check and the one
        # the community-marketplace review runs, but it needs the CLI installed and
        # is not reproducible on a bare runner. This covers the failure modes that
        # actually break a published plugin: unparseable JSON, a missing name, a
        # marketplace entry pointing at a plugin that isn't here, and the `author`
        # field whose absence makes --strict fail at submission time.
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          fail = []
          plugin = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(pathlib.Path(".claude-plugin/marketplace.json").read_text())
          for field in ("name", "description", "author", "version", "license"):
              if not plugin.get(field):
                  fail.append(f"plugin.json: missing '{field}'")
          if not market.get("name") or not market.get("owner") or not market.get("plugins"):
              fail.append("marketplace.json: needs name, owner and plugins")
          names = {p.get("name") for p in market.get("plugins", [])}
          if plugin["name"] not in names:
              fail.append(f"marketplace.json lists {names}, but plugin.json is '{plugin['name']}'")
          for entry in market.get("plugins", []):
              src = entry.get("source")
              if isinstance(src, str) and src.startswith(".") and not pathlib.Path(src).is_dir():
                  fail.append(f"marketplace.json: source '{src}' does not exist")
          for problem in fail:
              print(f"::error::{problem}")
          sys.exit(1 if fail else 0)
          PY

  version-bump:
    name: plugin content changed ⇒ version bumped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A shipped change must move the version
        # plugin.json sets `version`, so an installed plugin is PINNED to that
        # string — pushing new commits under an unchanged version ships nothing
        # while looking like it worked. This is the guard for that silent failure.
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}"
          git rev-parse --verify "$base" >/dev/null 2>&1 || { echo "no base commit to compare (first commit) — skipping"; exit 0; }
          # Listing what is NOT shipped, rather than what is. An allowlist of shipped
          # paths fails OPEN: add a commands/ or agents/ directory tomorrow and its
          # changes ship under an unchanged version, silently — the exact failure this
          # job exists to catch. A denylist fails closed, so anything new counts until
          # someone deliberately exempts it.
          #
          # marketplace.json is exempt because it is the catalogue, not this plugin.
          # An entry for a plugin hosted in another repo changes nothing a `pipeline`
          # install receives, and it reaches users on marketplace refresh rather than
          # through this plugin's pinned version. Requiring a bump for it would force a
          # release whose changelog has to claim pipeline changed when it did not.
          # Everything else under .claude-plugin/ — plugin.json above all — still counts.
          exempt='^(\.github/|CHANGELOG\.md|\.gitignore|\.claude-plugin/marketplace\.json$)'
          changed="$(git diff --name-only "$base" HEAD | grep -vE "$exempt" || true)"
          if [ -z "$changed" ]; then echo "no shipped content changed — bump not required"; exit 0; fi
          was="$(git show "$base:.claude-plugin/plugin.json" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' || echo "")"
          now="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json")).get("version",""))')"
          echo "shipped content changed:"; echo "$changed" | sed 's/^/  /'
          echo "version: $was -> $now"
          if [ "$was" = "$now" ]; then
            echo "::error::Plugin content changed but version is still $now. Bump .claude-plugin/plugin.json and add a CHANGELOG.md entry, or installs will never see this."
            exit 1
          fi
          grep -qF "## $now" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $now' entry"; exit 1; }
          echo "version bumped and changelogged"

  skills:
    name: skills are well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every skill has the frontmatter Claude Code needs
        # A skill missing `name` or `description` silently fails to load, and a
        # mismatched `name` registers the slash-command under the wrong word.
        run: |
          set -euo pipefail
          fail=0
          for dir in skills/*/; do
            slug="$(basename "$dir")"
            file="$dir/SKILL.md"
            if [ ! -f "$file" ]; then
              echo "::error::$dir has no SKILL.md"; fail=1; continue
            fi
            # Frontmatter is the block between the first two `---` lines.
            fm="$(awk '/^---$/{n++; next} n==1' "$file")"
            for key in name description argument-hint; do
              grep -qE "^$key:" <<<"$fm" || { echo "::error::$slug: missing '$key' in frontmatter"; fail=1; }
            done
            declared="$(grep -E '^name:' <<<"$fm" | head -1 | sed 's/^name:[[:space:]]*//')"
            [ "$declared" = "$slug" ] || { echo "::error::$slug: frontmatter name is '$declared', must match the directory"; fail=1; }
          done
          exit $fail

  config-example:
    name: example config parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The shipped example is a config the reader can actually consume
        # setup-worktree.sh reads envFiles/env/install out of a project's
        # .agents/worktree.json; if the example drifts from that shape, every repo
        # copied from it gets a bare worktree with no env and no node_modules.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sys
          cfg = json.load(open("examples/worktree.json"))
          missing = [k for k in ("envFiles", "install", "gate", "scopedCheck") if k not in cfg]
          if missing:
              print(f"::error::examples/worktree.json missing {missing}")
              sys.exit(1)
          assert isinstance(cfg["envFiles"], list), "envFiles must be a list"
          assert isinstance(cfg.get("env", {}), dict), "env must be an object"
          PY
          # And prove the real reader agrees, not just a schema guess: define the
          # script's own emit_config in this shell, then eval what it emits — the
          # same two steps setup-worktree.sh performs. Via a temp file rather than
          # `source <(…)`, which silently fails to define the function on bash 3.2
          # (macOS's system bash, where this check also has to run by hand).
          fn="$(mktemp)"
          sed -n '/^emit_config()/,/^}/p' bin/setup-worktree.sh > "$fn"
          . "$fn"
          eval "$(emit_config examples/worktree.json)"
          [ -n "$INSTALL_CMD" ] || { echo "::error::reader produced no install command"; exit 1; }
          [ "${#ENV_FILES[@]}" -gt 0 ] || { echo "::error::reader produced no env files"; exit 1; }
          echo "reader parsed the example: install=$INSTALL_CMD, ${#ENV_FILES[@]} env file(s)"
